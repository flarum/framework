      starting_in_text: "{name} is starting a discussion in {tags}"
      starting_text: "{name} is starting a discussion"
      was_replying_text: "{name} was replying in {discussion}"
      was_starting_in_text: "{name} was starting a discussion in {tags}"
      was_starting_text: "{name} was starting a discussion"

