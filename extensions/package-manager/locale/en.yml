flarum-extension-manager:
  # The admin page. Laid out in sections, with the long-standing keys kept
  # wherever the concept is the same, so existing translations carry across.
  admin:
    actions:
      add: Add
      cancel: Cancel
      remove: Remove
      save: Save

    page:
      # A spinner with no end is the failure this extension replaces. If the
      # page cannot load, it says so and offers the one useful action.
      load_failed: >-
        The Extension Manager could not load. Its API did not answer — check the browser
        console and your forum's error log for what went wrong.
      load_timeout: >-
        The Extension Manager's own page did not finish loading. Nothing is wrong with your
        site or your extensions; something is stopping this page talking to the
        forum. The browser console will say what.
      try_again: Try again

    sections:
      discover:
        title: Find extensions
        search: Search Packagist for a Flarum extension
        search_button: Search
        searching: Searching…
        hint: >-
          Every Flarum extension published on Packagist, most widely used first.
        # Against the version this forum RUNS, not against "Flarum 2". A forum on
        # 2.0.0 and one on 2.1.0 get different answers, and saying which version
        # was used is what makes the badge checkable.
        against: "Checked against the Flarum {version} this forum runs."
        no_match: "Nothing on Packagist matches “{query}”."
        empty_results: >-
          Packagist returned nothing. That is unusual — it may be having a moment.
        server_error: >-
          The search could not be run. Packagist may be unreachable from this server.
        show_more: Show more
        loading_more: Loading…
        open_packagist: "{name} on Packagist"
        tabs:
          label: Show
          all: All
          themes: Themes
          languages: Languages
          widgets: Widgets
        extension:
          downloads: "{count, plural, one {{formattedCount} download} other {{formattedCount} downloads}}"
          badges:
            abandoned: abandoned by its author
          abandoned_why: >-
            Its author has marked it as no longer maintained. It may still work.
          abandoned_for: "Its author says to use {replacement} instead."
          replaced: replaced
          replaced_by: "replaced by {replacement}"
          replaced_why: >-
            This name is an old one. The extension moved to a new package, and installing the old name
            gives you the new extension under the wrong id, which then cannot be enabled.
          install_replacement: "Install {replacement}"
          installed_as: "installed as {replacement}"
        # "Says it works", never "works". A declared constraint is the author's
        # claim; whether the rest of this site allows it is a question only the
        # plan can answer, and it is answered when Install is pressed.
        compat:
          incompatible: not for this Flarum
          incompatible_why: "Its newest release asks for flarum/core {requires}."
          unknown: could not check
          prerelease: "{version} — a pre-release"
          checking: Checking…

      installed:
        title: "Installed ({count})"

      queue:
        title: Recent updates
        none: Nothing has been updated, installed or removed with the Extension Manager on this forum yet.
        operations:
          extension_install: Installed
          extension_remove: Removed
          extension_update: Updated
        statuses:
          failure: Stopped
          rolled_back: Undone
        new_version: "{version} (new)"
        removed_version: "{version} (removed)"
        nothing: Nothing changed
        migrations: "Changed the database ({count, plural, one {# change} other {# changes}})."

    extensions:
      install: Install
      already_installed: installed
      # "Update", never "Upgrade". An upgrade sounds like a decision; an update
      # sounds like maintenance, and this is maintenance.
      update: Update
      update_one: "Update {name}"
      repin_confirm: >-
        This forum requires an exact version of {count, plural, one {# extension} other {# extensions}}, so a newer
        one cannot be installed until that requirement is changed. Continue, and
        composer.json will be updated to require the new version before anything
        is downloaded. A rollback puts the requirement back too.
      remove: Remove
      # "Remove files", not "Uninstall". Flarum already has an Uninstall button
      # on the extension's page that purges its DATA; this one takes the code off
      # the server. Two buttons a few pixels apart must not claim the same thing.
      remove_files: Remove files
      # Says how this differs from the Purge button beside it. Flarum's Purge
      # removes the extension's DATA and says plainly that it does not uninstall
      # the extension; this removes the CODE. Together they are a full uninstall,
      # and neither one alone should imply it is.
      remove_confirm: >-
        Remove {name}'s files from this server? This is the part Composer would do.
        The old files are kept, so it can be undone. Its database tables and
        settings are left alone — Flarum's own Purge button is what removes those,
        and doing that first is worth considering if you are not coming back.
      enabled: enabled
      disabled: disabled
      version_unknown: version unknown
      library: Composer package
      library_why: A library this forum requires in its own composer.json. It has no settings page, and the Extension Manager never offers to remove it.
      path_install: local checkout
      path_install_why: >-
        This extension is a symlink into a directory on this server, so it is
        probably one you are working on. The Extension Manager will not replace it — update it
        with git instead.
      open_settings: Open the {name} settings
      learn_more: Learn more

    updater:
      # "A newer version exists" — never "an update is available". The cheap
      # check knows the first and cannot know the second, and a badge that
      # overstates itself is one people stop reading.
      up_to_date: Everything checkable is up to date.
      some_newer: "{count, plural, one {# extension has} other {# extensions have}} a newer version."
      core_newer: Flarum itself has a newer version.
      core_newer_too: So does Flarum itself.
      last_checked: "Checked {when}."
      uncheckable: "{count} could not be checked — no repository this forum knows about lists them."
      tracking: "{count} track a branch, so there is no version to compare."
      check_now: Check now
      check_for_updates: Check for updates
      check_overdue: Check for updates to get the latest security fixes and features for your extensions.
      checking: Checking…
      update_all: "Update all {count}"
      starting: Starting…
      ago:
        minutes: "{count, plural, one {# minute} other {# minutes}} ago"
        hours: "{count, plural, one {# hour} other {# hours}} ago"
        days: "{count, plural, one {# day} other {# days}} ago"

      # On the dashboard.
      banner:
        title: "{count, plural, one {# package has} other {# packages have}} a newer version"
        body: >-
          That does not always mean you can install it — what else has to change, and
          whether anything blocks it, is worked out when you ask.
        checked: "Last checked {when}."
        uncheckable: "{count, plural, one {# package} other {# packages}} could not be checked at all."
        more: "and {count} more"
        open: Take a look
        dismiss: Not now

      flarum: Flarum itself
      core:
        loading: Checking Flarum…
        running: "This forum runs Flarum {version}."
        current: No newer Flarum has been published since the last check.
        update_to: "Update Flarum to {version}"
        failed: >-
          The Extension Manager could not work out what upgrading Flarum would involve. Nothing
          has changed.
        # Stated as a consequence, never as a bare count. "3 extensions" is a
        # number; "the upgrade would be refused" is the thing somebody needs to
        # know, and it is why the button is disabled.
        blocked: >-
          {count, plural, one {# extension has} other {# extensions have}} no release that works with Flarum {version}, so
          the upgrade would be refused. They are listed below.
        clear: "Every installed extension has a release that works with Flarum {version}."
        updating_too: >-
          {count, plural, one {# extension} other {# extensions}} will be updated at the same time, because their current
          version does not support the new Flarum.
        checking: "Checking {count, plural, one {# more extension} other {# more extensions}}…"
        # Their require says yes; their copy of Flarum's code may still not match.
        overrides: >-
          {count, plural, one {This extension replaces part of Flarum itself, so saying it supports Flarum {version} is not enough: its copy is frozen at the Flarum it was written for.} other {These extensions replace parts of Flarum itself, so saying they support Flarum {version} is not enough: their copies are frozen at the Flarum they were written for.}}
          If the update breaks the site it is put back. Check with the {count, plural, one {author} other {authors}} first,
          or remove {count, plural, one {it} other {them}} for the update; disabling is not enough, because Composer still loads the copy.
        row_overrides: "replaces {classes}"
        row_blocked: "no release for this Flarum — asks for {requires}"
        row_updating: "will update to {version}"
        row_unknown: could not be checked
        nightly:
          title: Nightly build.
          help: >-
            For testing what the next release will be: Flarum and its bundled
            extensions move to the development branch together. Not for a live forum.
          button: Try the nightly build
          confirm: >-
            Move Flarum and its bundled extensions to the nightly development build?
            Its database changes are recorded, and "Undo this update" returns the
            forum to the release it is on now.

    release_notes:
      title: "{name}: what's new since {from}"
      on_github: See the releases on GitHub
      none: No release notes were published on GitHub for these versions.
      empty_release: No notes were written for this release.
      failed: The release notes could not be loaded from GitHub just now.

    run:
      working: Updating
      done: Update finished
      failed: The update stopped
      rolled_back: Update undone
      target:
        update: Updating {packages}
        install: Installing {packages}
        remove: Removing {packages}
        more: "{shown} and {count} more"
      details: Update details
      start_failed: >-
        The update could not be started, and the forum did not say why. Nothing has
        changed.
      phases_label: Progress
      phases:
        plan: Working out what changes
        fetch: Downloading
        apply: Swapping files in
        finalise: Finishing up
      working_out: Asking Composer what this involves. This is the slow part.
      working_on: "{item} — {index} of {total}"
      # The runner's own step names, as shown under the progress bar.
      steps:
        check_the_site: Checking the site
        work_out_what_changes: Working out what changes
        check_file_permissions: Checking file permissions
        register: Updating Composer's records
        migrations: Running database migrations
        assets: Publishing assets
        caches: Clearing caches
        code_cache: Clearing PHP's code cache
        check_the_site_again: Checking the site again
        tidy_the_trash: Tidying old copies
      failed_at: "It stopped during: {step}"
      roll_back: Undo this update
      rolling_back: Undoing…
      roll_back_confirm: >-
        Put the extensions this update changed back to the versions they were
        before it, along with composer.json and composer.lock?
      roll_back_confirm_db: >-
        Put the extensions this update changed back to the versions they were
        before it, along with composer.json and composer.lock? This update also
        changed the database ({count, plural, one {# change} other {# changes}}). Undoing reverses those too,
        which removes anything stored in what they added.
      rollback_failed: >-
        The rollback itself failed. Nothing was deleted at any point, so the old
        files are still under storage/extension-manager/trash.
      dismiss: Dismiss
      reload_page: Reload the page
      reload_page_why: This page still has the previous versions' code and version numbers until it reloads.
      # Each of these says what IS happening, not just that something is wrong.
      # A message that only signals trouble is how somebody ends up refreshing a
      # page for ten minutes.
      another_driver: >-
        A background worker is doing the next step, so this page is just watching.
      nothing_moved: >-
        Nothing has moved for a couple of minutes. That is normal while Composer is
        working something out; if it stays like this, the log below is the place to
        look.
      poll_unauthorised: >-
        This screen cannot reach the server to drive the update — usually a
        session that has expired while the page sat open. The update itself is
        unaffected and is being carried on in the background. Reload the page.
      watching_only: Showing progress read-only.
      poll_failing: >-
        This page has failed to reach the forum {count} times in a row. The update
        itself is unaffected — it keeps its place on disk — and this will keep
        trying.

    composer:
      title: Sources
      config_failed: >-
        The Extension Manager could not read composer.json. Nothing has been changed.
      add_repository_label: Add a repository
      remove_repository_label: "Remove {name}"
      repositories:
        label: Where Composer looks
        help: >-
          Extensions that are not on Packagist — your own private repositories, or a
          paid marketplace — have to be listed here before Composer can find them.
        none: Only Packagist. Nothing private or paid can be installed.
        stat: "{count, plural, one {repository} other {repositories}}"
        filter: Filter repositories
        no_match: "No repository matches “{query}”."
        open: Open in a new tab
        remove_named: "Remove {name}?"
        duplicate: That repository is already listed.
        will_add: "Adds {name} from {where}."
        types:
          vcs: Git repository
          composer: Composer repository
          path: Folder on this server
        type_help:
          vcs: GitHub, GitLab, Bitbucket or any Git host
          composer: Private Packagist or a paid marketplace
          path: A local checkout, for development
        placeholders:
          vcs: "https://github.com/you/your-extension"
          composer: "https://repo.example.com"
          path: "/home/you/extensions/your-extension"
      minimum_stability:
        label: How finished a release has to be
        help: >-
          Composer refuses anything less finished than this. The error it gives when
          the setting is too strict says the package "could not be found in any
          version", which sounds like the package is missing rather than like a
          setting is wrong.
        stat: lowest release accepted
        recommended: recommended
        prefer_stable: Still prefer a stable release when one exists
        prefer_stable_help: >-
          When an extension has both a beta and a finished release that would work, take the finished one.
        options:
          stable: Stable
          rc: RC
          beta: Beta
          alpha: Alpha
          dev: Dev
        short:
          stable: finished only
          rc: release candidates
          alpha: early previews
          dev: unreleased code
        # What each level means, said before the change: the consequence is the
        # part somebody is deciding about.
        means:
          stable: >-
            Only finished releases. Flarum 2 itself is stable, but many of its extensions
            are still betas or release candidates, and this cannot install those.
          rc: Release candidates as well as finished releases.
          beta: >-
            Betas too. Many Flarum 2 extensions are still published as betas or release
            candidates, so this is the usual choice.
          alpha: Alphas as well — early code that is expected to change.
          dev: >-
            Unreleased code straight from a branch, which can change under you without
            a version number changing.

    auth_config:
      title: Credentials
      help: >-
        For private repositories and paid marketplaces. Stored in auth.json, which
        Composer reads and which sits outside the web root.
      no_auth_methods_configured: None stored. Private and paid repositories will fail to download.
      stat: "{count, plural, one {host can sign in} other {hosts can sign in}}"
      add_label: Add a credential
      edit_label: Replace
      remove_host_label: "Remove {name}"
      remove_q: Remove?
      submit_button: Save credential
      token_stored: token stored
      show: Show
      hide: Hide
      fields:
        host: Host
        username: Username
        password: Password
        token: Token
      add_modal:
        host_placeholder: "github.com"
        username_placeholder: username
        secret_placeholder: token or password
      types:
        github-oauth: GitHub token
        gitlab-token: GitLab token
        bearer: Bearer token
        http-basic: Username & password
      type_help:
        github-oauth: Private GitHub repositories
        gitlab-token: GitLab.com or your own GitLab
        bearer: Marketplaces that give you an API token
        http-basic: Private Packagist and older repositories
      create_github_token: Create a GitHub token (repo scope)
      create_gitlab_token: Create a GitLab access token
      # The note GitHub keeps beside the token, so its owner knows what it is for.
      github_token_note: "Composer on {forum}"
      # Said on screen, not just in the code. Somebody who expects to be able to
      # read a token back needs to know why they cannot, or they will assume it
      # did not save and enter it repeatedly.
      write_only: >-
        The Extension Manager never shows a stored credential — not even to you. It shows
        which hosts have one. To change a credential, enter the new value; it
        replaces the old one.

    trash:
      title: Rollback copies
      help: >-
        Every update keeps the versions it replaced, so it can be rolled back.
        Copies no rollback can use any more are tidied after each update and
        every night. The copies the latest update needs are never removed.
      size: Taking up
      size_value: "{size} in {count, plural, one {# copy} other {# copies}}"
      freeable: Can be tidied now
      freeable_value: "{size} — {count, plural, one {# item} other {# items}}"
      freeable_none: Nothing — everything kept is still needed
      last: Last tidied
      last_value: "{when} — {count, plural, =0 {nothing to remove} other {removed #, freed {size}}}"
      last_never: Not yet
      keep_days: Keep rollback copies for
      days: days
      keep_runs: or for the last
      runs: updates
      prune: Tidy now
      pruning: Tidying…
      saved: Saved.
      rule: >-
        Copies from the last {days} days or the last {runs} updates are kept,
        whichever keeps more. Copies for the latest update, for one still in
        progress and for anything that changed in the last day are always kept.
      confirm: >-
        Remove {count, plural, one {# item} other {# items}} and free {size}?
        They belong to updates that can no longer be rolled back from this
        screen. The latest update can still be rolled back.
      done: "{count, plural, =0 {Nothing needed removing.} one {Removed # item, freeing {size}.} other {Removed # items, freeing {size}.}}"
      failed: The Extension Manager could not read its rollback copies.

    # The host tab's PHP diagnosis. Three faults, three fixes: proc_open
    # disabled, no command-line PHP found (usually open_basedir), or one found
    # that fails to run. And always the reminder that the PHP somebody tests
    # over SSH is configured separately from the website's. The server sends
    # these keys, relative to admin.
    host:
      title: This host
      spawn_ok: Can run Composer as a separate process
      spawn_ok_why: Composer runs outside the web request, so its memory use is its own and cannot take the site down with it.
      in_process: Runs without separate processes
      in_process_why: >-
        The Extension Manager cannot start a separate process on this host, so it runs
        Composer inside the web request instead. Composer still
        only works out what changes; the Extension Manager downloads and swaps the files
        itself, journalled, so every update can be rolled back as usual.
      in_process_limits: >-
        The limits: Composer shares the request's memory and time, so the first
        update takes longer while Composer's cache is cold (measured on a forum
        with 346 packages and 22 private GitHub repositories: about {cold}
        seconds the first time, about {warm} once the cache is warm), and
        private Git repositories need a GitHub token or a Composer repository,
        because git cannot run here.
      in_process_fix_ini: "To run Composer in its own process instead, ask your host to remove proc_open from disable_functions. The setting comes from {ini}, or from the PHP settings of this site in your hosting panel."
      in_process_fix: To run Composer in its own process instead, ask your host to remove proc_open from disable_functions for this site.
      in_process_no_php: >-
        No command-line PHP was found to start a separate process with (the PHP
        row below says why). Fixing that moves Composer back into its own
        process.
      memory_in_process: "Memory: {limit} (raised while Composer works)"
      memory_in_process_why: >-
        This host lets the Extension Manager lift memory_limit while Composer runs inside
        the request, and it is put back afterwards, so updates of any size can
        be worked out.
      time_none: "Execution limit: none"
      time_limit: "Execution limit: {seconds} seconds"
      time_in_process_lifted: >-
        The Extension Manager lifts the time limit while Composer works out an update, and
        puts it back afterwards. A proxy in front of PHP can still cut a long
        request short; if one does, the Extension Manager tries again with what Composer
        already downloaded.
      time_in_process_locked: >-
        This host limits each request to {seconds} seconds of PHP time and
        does not let the Extension Manager extend that. Working out an update is one
        request, so on a cold cache it may be cut short, by this limit or by
        the web server's own timeout.
      time_in_process_retry: >-
        If it is, nothing is changed: the Extension Manager tries again by itself, up to
        six times, and each try starts further along because Composer keeps
        what it downloaded. If it still cannot finish, ask your host to raise
        max_execution_time for this site (120 seconds is plenty).
      git_needed: Some package sources need git, which cannot run here
      git_needed_why: >-
        Composer reads these sources with git, and this host does not let PHP
        start programs, so an update would stop before changing anything.
      git_needed_token: "Add a GitHub token under Sources so Composer reads these through GitHub's API instead: {urls}"
      git_needed_git: "These can only be read with git. Serve their packages from a Composer repository (Packagist, Private Packagist or Satis) instead, or remove the source: {urls}"
      ssh_differs: >-
        If proc_open and PHP work when you test them over SSH, that is expected:
        the PHP you use over SSH is a different program, configured separately
        from the PHP that runs your website. What matters here is the website's.
      php_found: "Command-line PHP: {path} {version}"
      php_found_why: Found and proved by running it. Composer and Flarum's own commands run with this PHP.
      php_found_override_why: This is the path set below. It runs, and reports itself as the command-line PHP.
      php_hidden: "open_basedir is hiding the command-line PHP ({path})"
      php_hidden_why: >-
        This website's PHP is only allowed to look inside: {openBasedir}. The
        command-line PHP lives outside that list, so the Extension Manager cannot find it,
        even though it is installed.
      php_hidden_fix_plesk: >-
        To fix it in Plesk: Websites & Domains → your domain → PHP Settings →
        open_basedir, and add :{dir} to the end of the value. Save, then reload
        this page.
      php_hidden_fix_cpanel: >-
        To fix it in cPanel: MultiPHP INI Editor → choose this domain → find
        open_basedir and add :{dir} to the end of it (or ask your host to). Save,
        then reload this page.
      php_hidden_fix_generic: >-
        To fix it: add :{dir} to open_basedir in this site's php.ini or PHP-FPM
        pool (php_admin_value[open_basedir]), then restart PHP-FPM and reload
        this page.
      php_fails: "Found a command-line PHP that will not run ({path})"
      php_fails_why: "Running it failed with: {error}"
      php_missing: No command-line PHP was found
      php_missing_why: >-
        Composer needs PHP's command-line program (often called php or php8.x),
        and none was found in the usual places. Ask your host where it is, or
        to install it.
      php_override_broken_title: The command-line PHP set below does not work
      php_override_broken: "The path set below, {path}, does not run as the command-line PHP. It may have moved after a PHP upgrade."
      php_override_detected: "The Extension Manager found a working one at {path}. Use that path below, or clear the setting to let the Extension Manager find it."
      php_override_hint: If you know where the command-line PHP is, enter its full path below and the Extension Manager will check it and use it.
      summary_in_process: >-
        Everything works on this host, with Composer running inside the web
        request because separate processes are not allowed. Updates still
        replace one package at a time, journalled, so they stay safe and
        reversible.
      summary_in_process_time: >-
        Updates work here, with Composer running inside the web request. This
        host's time limit is short and locked, so the first update may need a
        retry or two, which the Extension Manager does by itself.
      summary_in_process_git: >-
        Composer runs inside the web request on this host, and some of this
        site's package sources need git, which cannot run here. The git row
        below says what to change.
      php_setting_label: Command-line PHP path
      php_setting_help: >-
        Only needed when the Extension Manager cannot find it by itself. Use the full path
        to the command-line PHP (not php-fpm), for example
        /opt/plesk/php/8.5/bin/php. It is checked by running it before it is
        saved. Leave empty to let the Extension Manager look.
      php_setting_save: Save
      php_setting_clear: Clear
      php_setting_saved: Saved. The Extension Manager will use this PHP.
      php_setting_cleared: Cleared. The Extension Manager will look for the command-line PHP itself.


  # Messages the server writes: API errors, run notes, host checks.
  # Translated on the server through Flarum's translator.
  api:
    unknown_action: "Unknown action."
    apply:
      local_path: "{package} is installed from a local path — {path} is a symlink into a checkout on this machine. The Extension Manager will not replace it, because the copy you are editing would stop being the copy the forum uses. Update it with git instead."
      move_aside_failed: "Could not move {from} aside to {to}"
      move_in_failed: "Could not move {from} into place at {to}"
      previous_unfinished: "A previous apply did not finish. Roll it back or resume it before starting another."
    change:
      added: "{package} {version} (new)"
      removed: "{package} {version} (removed)"
    check:
      no_lock: "The Extension Manager could not read composer.lock, so it cannot tell what is installed."
    composer:
      advice_memory: "Ask your host to raise memory_limit for this site (256 MB is plenty), or update fewer extensions at once."
      advice_time: "Composer keeps what it downloads, so pressing Update again later often gets further. If it keeps stopping, ask your host to raise max_execution_time for this site (120 seconds is plenty), or to allow proc_open so Composer can run in its own process."
      and_more: ", and {count} more"
      assets_published: "Assets published"
      autoloader_copy_failed: "Could not save a copy of the autoloader, so Composer was not run."
      broke_site_no_restore: "This update stopped the site from answering, and there is nothing saved to put back."
      broke_site_restored: "This update stopped the site from answering, so it has been put back."
      caches_cleared: "Caches cleared; the formatter and the compiled assets rebuilt"
      autoload_files_pruned: "Composer stopped loading the files that left with it, so the site keeps answering until the autoloader is rebuilt"
      composer_failed: "Composer failed:"
      core_db_failed: "Flarum's files were updated but its database could not be: {error}"
      core_db_failed_undone: "Flarum's files were updated but its database could not be ({error}), so the update was undone before the site could be left showing \"Update Flarum\"."
