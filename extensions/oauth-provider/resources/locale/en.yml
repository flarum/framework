flarum-oauth-provider:
  admin:
    clients:
      applications:
        heading: "Applications"
        help: "Applications you add by hand, such as another site that lets members log in with their account here. Each gets a client ID, and a secret if it can keep one."
        empty: "No applications added yet."
        off: "Applications added by an admin are switched off in Settings: they can't log members in or use the access members gave them."
      self_registered:
        heading: "Self-registered applications"
        help: "Applications that connected on their own, such as AI assistants using MCP (Claude, ChatGPT, Codex). They register themselves, or identify themselves by the URL of a metadata document."
        empty: "No application has registered itself yet."
        off: "Self-registered applications are switched off in Settings: new ones can't connect, and these can't log members in or use the access members gave them."
      new_button: "Add client"
      connections: "{count, plural, one {# member} other {# members}}"
      connections_none: "No members"
      last_used: "Last used {ago}"
      never_used: "Never used"
      name_column: "Name"
      id_column: "Client ID"
      redirects_column: "Redirect URIs"
      status_column: "Status"
      status_active: "Active"
      status_revoked: "Revoked"
      edit_button: "Edit"
      delete_button: "Delete"
      rotate_button: "Rotate secret"
      delete_confirm: "Delete this OAuth client? This will invalidate any existing tokens issued to it."
      rotate_confirm: "Rotate this client's secret? The old secret will stop working immediately, all existing access/refresh tokens will be revoked, and any apps using the old secret will need the new one to reconnect."

    form:
      new_title: "Add OAuth client"
      edit_title: "Edit OAuth client"
      name_label: "Display name"
      redirect_uris_label: "Redirect URIs"
      redirect_uris_help: "One URI per line. The client must send one of these as redirect_uri on the authorization request."
      scopes_label: "Allowed scopes"
      scopes_help: "Space-separated list of scopes this client may request. Leave empty to allow every scope."
      confidential_label: "Confidential client (backend can keep a secret)"
      confidential_help: "Uncheck for public clients (SPA, mobile) that must use PKCE. This cannot be changed after creation."
      revoked_label: "Revoked (reject all new auth requests)"
      save_button: "Save"

    sections:
      registration:
        label: "Allowed applications"
        description: "Which applications may log members in. Switching a kind off stops its applications working, without deleting them, until it is switched back on."

    settings:
      allow_self_registered_clients_label: "Allow self-registered applications"
      allow_self_registered_clients_help: "Lets applications such as MCP clients (Claude, ChatGPT) connect on their own: with Dynamic Client Registration (RFC 7591) they register themselves at /oauth/register, and with a Client ID Metadata Document they identify themselves by a URL that describes them. They are always public clients and must use PKCE."
      allow_admin_clients_label: "Allow applications added by an admin"
      allow_admin_clients_help: "Lets the applications on the Applications tab log members in. Switched off, Add client is hidden as well."
      source_metadata_document: "Metadata document"
      source_dynamic: "Self-registered"

    tabs:
      applications: "Applications"
      self_registered: "Self-registered"
      settings: "Settings"

    permissions:
      connect_label: "Connect applications to their account"

    secret_modal:
      title: "Client created"
      intro: "Save these credentials now — the secret is not shown again."
      rotated_title: "Secret rotated"
      rotated_intro: "The client secret has been replaced. Update the consuming application with the new secret — the old one will no longer work, and any existing sessions have been revoked."
      client_id_label: "Client ID"
      client_secret_label: "Client secret"
      close_button: "I've saved these"

  lib:
    gambits:
      users:
        connected:
          key: connected
          hint: client ID

  api:
    scopes_empty_message: "Allowed scopes can't be an empty list. Leave the field empty to allow every scope, or revoke the client to block it."
    scope_unknown_message: "Unknown scope: {scope}."

  forum:
    consent:
      title: "Authorize application"
      intro: "Hi {username}, {client} wants to access your account."
      scopes_heading: "This will allow it to:"
      approve_button: "Authorize"
      deny_button: "Cancel"
      from_host: "from {host}"
      unverified: "unverified, self-registered"
      redirect_host: "After you decide, you will be sent to {host}."

    connected_apps:
      heading: "Connected applications"
      help_text: "Applications you allowed to use your account, such as AI assistants. Revoking one signs it out. Logging out everywhere disconnects them all."
      empty: "You haven't connected any applications."
      from_host: "from {host}"
      connected: "Connected"
      last_used: "Last used"
      never_used: "Never"
      revoke_button: "Revoke"
      revoke_confirm: "Revoke access for {client}? It will be signed out and has to ask for permission again."
      revoked: "{client} no longer has access to your account."
      revoke_all_button: "Revoke all"
      revoke_all_confirm: "Revoke access for every connected application? Each will be signed out and has to ask for permission again."
      revoked_all: "No application has access to your account any more."

# Shown by flarum/gdpr when describing what it does with a member's connected applications.
flarum-gdpr:
  lib:
    data:
      connectedapplications:
        export_description: The applications you connected to your account, with what you allowed them and when.
        anonymize_description: => flarum-gdpr.lib.data.connectedapplications.delete_description
        delete_description: The applications you connected are disconnected, and their access to your account is removed.
