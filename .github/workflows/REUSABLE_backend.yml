name: Flarum Backend Jobs

on:
  workflow_call:
    inputs:
      enable_backend_testing:
        description: "Enable Backend Testing?"
        type: boolean
        default: true
        required: false

      enable_phpstan:
        description: "Enable PHPStan Static Analysis?"
        type: boolean
        default: false
        required: false

      enable_redis:
        description: "Start a Redis-compatible service (127.0.0.1:6379) for backend tests?"
        type: boolean
        default: false
        required: false

      redis_variant:
        description: "Which Redis-compatible server to start: 'redis' or 'valkey'."
        type: string
        default: 'redis'
        required: false

      redis_version:
        description: "Image tag for the Redis/Valkey service, e.g. 'latest', '7.2', '8.0-alpine'."
        type: string
        default: 'latest'
        required: false

      redis_clients:
        description: >-
          JSON array of Redis client libraries to run the test matrix against.
          Only meaningful when `enable_redis` is true. 'phpredis' loads the
          native `redis` PHP extension; 'predis' relies on the pure-PHP client.
          Default is a single empty entry, which adds no client dimension and
          leaves the matrix unchanged for repos that don't need to distinguish
          clients. Set to e.g. '["phpredis", "predis"]' to test both.
        type: string
        default: '[""]'
        required: false

      backend_directory:
        description: The directory of the project where backend code is located. This should contain a `composer.json` file, and is generally the root directory of the repo.
        type: string
        required: false
        default: '.'

      # Only relevant in mono-repos.
      monorepo_tests:
        description: "The list of directories to test in a monorepo. This should be a space-separated list of directories relative to the backend directory."
        type: string
        required: false

      php_versions:
        description: Versions of PHP to test with. Should be array of strings encoded as JSON array
        type: string
        required: false
        # Keep PHP versions synced with build-install-packages.yml
        default: '["8.3", "8.4", "8.5"]'

      latest_php:
        description: The latest PHP version to test with. DB-specific jobs run only on this version. Keep in sync with the last entry of php_versions.
        type: string
        required: false
        default: '8.5'

      php_extensions:
        description: PHP extensions to install.
        type: string
        required: false
        default: 'curl, dom, gd, json, mbstring, openssl, pdo_mysql, tokenizer, zip'

      db_versions:
        description: >-
          Versions of databases to test with. Should be array of strings encoded as JSON array.
          Each entry runs on `latest_php`; older PHP versions are covered separately against a
          single reference database. Images are pinned so a run is reproducible. The default
          covers, per driver, the version Flarum declares as its minimum, the version it
          recommends, and the newest long-term release — see Flarum\Database\DatabaseRequirements.
        type: string
        required: false
        default: >-
          ["mysql:5.7", "mysql:8.4", "mysql:9.7",
           "mariadb:10.3", "mariadb:11.8", "mariadb:12.3",
           "postgres:10", "postgres:15", "postgres:18",
           "sqlite:3"]

      db_prefix:
        description: >-
          Table prefix for the prefixed jobs on drivers that allow 64-character identifiers,
          at the longest Flarum accepts there (DatabaseRequirements::maxTablePrefixLength).
          These jobs cover both identifier length limits and the prefix handling in each
          driver's schema code, so there is one per driver, each at that driver's maximum.
        type: string
        required: false
        default: 'flarum_c_'

      db_prefix_pgsql:
        description: >-
          As `db_prefix`, but one byte shorter: PostgreSQL limits identifiers to 63 bytes
          rather than 64 characters.
        type: string
        required: false
        default: 'flarum_p'

      php_ini_values:
        description: PHP ini values
        type: string
        required: false
        default: error_reporting=E_ALL

      runner_type:
        description: The type of runner to use for the jobs. This should be one of the types supported by the `runs-on` keyword.
        type: string
        required: false
        default: 'ubuntu-latest'

    secrets:
      composer_auth:
        description: The Composer auth tokens to use for private packages.
        required: false

env:
  COMPOSER_ROOT_VERSION: dev-main
  # `inputs.composer_directory` defaults to `inputs.backend_directory`
  FLARUM_TEST_TMP_DIR_LOCAL: tests/integration/tmp
  COMPOSER_AUTH: ${{ secrets.composer_auth }}
  DB_DATABASE: flarum_test
  DB_USERNAME: flarum
  DB_PASSWORD: password

jobs:
  test:
    runs-on: ${{ inputs.runner_type }}

    strategy:
      # One database failing should not hide the state of the others.
      fail-fast: false

      matrix:
        # Every database in `db_versions` runs on the latest PHP. Older PHP versions are
        # added below against one reference database: a PHP-version bug is not specific to
        # a database engine, so a full cross-product buys coverage that cannot fail alone.
        php: ['${{ inputs.latest_php }}']
        service: ${{ fromJSON(inputs.db_versions) }}
        prefix: ['']

        # Redis client library to exercise. Defaults to a single empty entry
        # (no extra dimension); repos that enable_redis can opt into testing
        # both 'phpredis' and 'predis' via the `redis_clients` input.
        redis_client: ${{ fromJSON(inputs.redis_clients) }}

        include:
          # Human-readable names and the driver each image speaks. These match on `service`,
          # so they annotate the combinations above rather than adding any.
          - service: 'mysql:5.7'
            db: MySQL 5.7
            driver: mysql
          - service: 'mysql:8.4'
            db: MySQL 8.4
            driver: mysql
          - service: 'mysql:9.7'
            db: MySQL 9.7
            driver: mysql
          - service: 'mariadb:10.3'
            db: MariaDB 10.3
            driver: mariadb
          - service: 'mariadb:11.8'
            db: MariaDB 11.8
            driver: mariadb
          - service: 'mariadb:12.3'
            db: MariaDB 12.3
            driver: mariadb
          - service: 'postgres:10'
            db: PostgreSQL 10
            driver: pgsql
          - service: 'postgres:15'
            db: PostgreSQL 15
            driver: pgsql
          - service: 'postgres:18'
            db: PostgreSQL 18
            driver: pgsql
          - service: 'sqlite:3'
            db: SQLite
            driver: sqlite

          # PHP coverage, against the recommended MySQL rather than the newest, since that
          # is the version most installations are expected to be on.
          - php: ${{ fromJSON(inputs.php_versions)[0] }}
            service: 'mysql:8.4'
            db: MySQL 8.4
            driver: mysql
          - php: ${{ fromJSON(inputs.php_versions)[1] }}
            service: 'mysql:8.4'
            db: MySQL 8.4
            driver: mysql

          # One prefixed run per driver. Identifier limits differ (64 characters on
          # MySQL/MariaDB, 63 bytes on PostgreSQL, which truncates silently), and each
          # driver applies the prefix through its own schema code.
          - php: ${{ inputs.latest_php }}
            service: 'mysql:9.7'
            db: MySQL 9.7
            driver: mysql
            prefix: ${{ inputs.db_prefix }}
            prefixStr: (prefix)
          - php: ${{ inputs.latest_php }}
            service: 'mariadb:12.3'
            db: MariaDB 12.3
            driver: mariadb
            prefix: ${{ inputs.db_prefix }}
            prefixStr: (prefix)
          - php: ${{ inputs.latest_php }}
            service: 'postgres:18'
            db: PostgreSQL 18
            driver: pgsql
            prefix: ${{ inputs.db_prefix_pgsql }}
            prefixStr: (prefix)
          - php: ${{ inputs.latest_php }}
            service: 'sqlite:3'
            db: SQLite
            driver: sqlite
            prefix: ${{ inputs.db_prefix }}
            prefixStr: (prefix)

    services:
      mysql:
        image: ${{ matrix.driver == 'mysql' && matrix.service || '' }}
        env:
          MYSQL_DATABASE: ${{ env.DB_DATABASE }}
          MYSQL_USER: ${{ env.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
      mariadb:
        image: ${{ matrix.driver == 'mariadb' && matrix.service || '' }}
        env:
          MARIADB_DATABASE: ${{ env.DB_DATABASE }}
          MARIADB_USER: ${{ env.DB_USERNAME }}
          MARIADB_PASSWORD: ${{ env.DB_PASSWORD }}
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306
        options: --health-cmd="healthcheck.sh --connect" --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: ${{ matrix.driver == 'pgsql' && matrix.service || '' }}
        env:
          POSTGRES_DB: ${{ env.DB_DATABASE }}
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ${{ inputs.enable_redis && format('{0}:{1}', inputs.redis_variant == 'valkey' && 'valkey/valkey' || 'redis', inputs.redis_version) || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    name: "PHP ${{ matrix.php }} / ${{ matrix.db }} ${{ matrix.prefixStr }}${{ matrix.redis_client && format(' [{0}]', matrix.redis_client) || '' }}"

    if: >-
      inputs.enable_backend_testing &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name != 'pull_request')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          # Coverage is not collected or uploaded anywhere, and Xdebug slows the
          # test suite considerably, so leave it disabled.
          coverage: none
          # Append the native `redis` extension only for the phpredis matrix
          # leg. The predis leg deliberately omits it so fof/redis (and any
          # redis-enabled repo) falls back to the pure-PHP client, exercising
          # both code paths.
          extensions: ${{ inputs.php_extensions }}${{ matrix.redis_client == 'phpredis' && ', redis' || '' }}
          tools: phpunit, composer:v2
          ini-values: ${{ inputs.php_ini_values }}

      # SQLite is compiled into PHP rather than run as a service, so its version comes from
      # the runner image and cannot be pinned like the other drivers. Record it, and fail if
      # a runner update ever drops below the version Flarum declares as its minimum.
      - name: Report SQLite version
        if: matrix.driver == 'sqlite'
        run: |
          php -r '
            $v = SQLite3::version()["versionString"];
            echo "SQLite $v\n";
            if (version_compare($v, "3.35.0", "<")) {
              echo "::error::Runner SQLite $v is below Flarum SQLITE_MINIMUM 3.35.0\n";
              exit(1);
            }
          '

      - name: Install Composer dependencies
        run: composer install
        working-directory: ${{ inputs.backend_directory }}

      # If we have a `inputs.monorepo_tests`, we will run tests for each item of the provided array in a ::group::item
      # If we don't have a `inputs.monorepo_tests`, we will run tests for the current repository
      # We also have to run the `composer test:setup` script first before running each test
      - name: Run tests
        run: |
          if [ -z "${{ inputs.monorepo_tests }}" ]; then
            composer test:setup
            composer test
          else
            for test in ${{ inputs.monorepo_tests }}; do
              echo "::group::Running tests for $test"
              composer test:setup --working-dir=$test
              composer test --working-dir=$test
              echo "::endgroup::"
            done
          fi
        working-directory: ${{ inputs.backend_directory }}
        env:
          FLARUM_REPEATED_QUERY_LOG: ${{ runner.temp }}/repeated-queries.jsonl
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ (matrix.driver == 'mysql' && job.services.mysql.ports['3306']) || (matrix.driver == 'mariadb' && job.services.mariadb.ports['3306']) || (matrix.driver == 'pgsql' && job.services.postgres.ports['5432']) }}
          DB_PREFIX: ${{ matrix.prefix }}
          DB_DRIVER: ${{ matrix.driver }}
          COMPOSER_PROCESS_TIMEOUT: 600

      # Surface the query findings on the pull request itself. A developer who
      # only ever looks at the checks page would otherwise never see the
      # warnings PHPUnit prints mid-log. Runs even when the tests fail, since a
      # failing N+1 is exactly what we want to point at.
      - name: Report repeated queries
        if: ${{ !cancelled() }}
        run: |
          log="${{ runner.temp }}/repeated-queries.jsonl"

          [ -s "$log" ] || exit 0

          # One annotation per distinct finding; identical findings recur across
          # tests, so collapse them first.
          sort -u "$log" | while read -r finding; do
            level=$(echo "$finding" | jq -r 'if .scaling then "error" else "warning" end')
            title=$(echo "$finding" | jq -r 'if .scaling then "N+1 query" else "Repeated query" end')
            echo "$finding" | jq -r --arg level "$level" --arg title "$title" \
              '"::\($level) title=\($title)::\(.where) — \(.count) executions, \(.distinctBindings) distinct: \(.sql)"'
          done

          {
            echo "### Query findings"
            echo
            echo "| | Where | Executions | Distinct | Query |"
            echo "|---|---|---|---|---|"
            sort -u "$log" | jq -r '"| \(if .scaling then "🛑 N+1" else "⚠️ repeated" end) | `\(.where)` | \(.count) | \(.distinctBindings) | `\(.sql | .[0:120])` |"'
            echo
            echo "🛑 grows with your data — fix it. ⚠️ repeats a few values — consider memoising."
          } >> "$GITHUB_STEP_SUMMARY"

  phpstan:
    runs-on: ${{ inputs.runner_type }}

    strategy:
      matrix:
        php: ${{ fromJson(inputs.php_versions) }}

    name: 'PHPStan PHP ${{ matrix.php }}'

    if: >-
      inputs.enable_phpstan &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name != 'pull_request')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: ${{ inputs.php_extensions }}
          tools: phpunit, composer:v2
          ini-values: ${{ inputs.php_ini_values }}

      - name: Install Composer dependencies
        run: composer install
        working-directory: ${{ inputs.backend_directory }}

      - name: Create MySQL Database
        run: |
          sudo systemctl start mysql
          mysql -uroot -proot -e 'CREATE DATABASE flarum_test;' --port 3306

      - name: Run PHPStan
        run: composer analyse:phpstan
        env:
          DB_USERNAME: root
          DB_PORT: 3306
          DB_PASSWORD: root
          COMPOSER_PROCESS_TIMEOUT: 600
          FLARUM_TEST_TMP_DIR_LOCAL: ./tmp
