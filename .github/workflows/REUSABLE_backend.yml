name: Flarum Backend Jobs

on:
  workflow_call:
    inputs:
      enable_backend_testing:
        description: "Enable Backend Testing?"
        type: boolean
        default: true
        required: false

      enable_phpstan:
        description: "Enable PHPStan Static Analysis?"
        type: boolean
        default: false
        required: false

      backend_directory:
        description: The directory of the project where backend code is located. This should contain a `composer.json` file, and is generally the root directory of the repo.
        type: string
        required: false
        default: '.'

      php_versions:
        description: Versions of PHP to test with. Should be array of strings encoded as JSON array
        type: string
        required: false
        default: '["7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]'

      php_extensions:
        description: PHP extensions to install.
        type: string
        required: false
        default: 'curl, dom, gd, json, mbstring, openssl, pdo_mysql, tokenizer, zip'

      db_versions:
        description: Versions of databases to test with. Should be array of strings encoded as JSON array
        type: string
        required: false
        default: '["mysql:5.7", "mysql:8.0.30", "mariadb"]'

      php_ini_values:
        description: PHP ini values
        type: string
        required: false
        default: error_reporting=E_ALL

      runner_type:
        description: The type of runner to use for the jobs. This should be one of the types supported by the `runs-on` keyword.
        type: string
        required: false
        default: 'ubuntu-latest'

    secrets:
      composer_auth:
        description: The Composer auth tokens to use for private packages.
        required: false

env:
  COMPOSER_ROOT_VERSION: dev-main
  FLARUM_TEST_TMP_DIR_LOCAL: tests/integration/tmp
  COMPOSER_AUTH: ${{ secrets.composer_auth }}

jobs:
  test:
    runs-on: ${{ inputs.runner_type }}

    strategy:
      matrix:
        php: ${{ fromJSON(inputs.php_versions) }}
        service: ${{ fromJSON(inputs.db_versions) }}
        prefix: ['']
        php_ini_values: [inputs.php_ini_values]

        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstrategymatrixinclude
        include:
          # Expands the matrix by naming DBs.
          - service: 'mysql:5.7'
            db: MySQL 5.7
          - service: 'mysql:8.0.30'
            db: MySQL 8.0
          - service: mariadb
            db: MariaDB

          # Include Database prefix tests with only one PHP version.
          - php: ${{ fromJSON(inputs.php_versions)[0] }}
            service: 'mysql:5.7'
            db: MySQL 5.7
            prefix: flarum_
            prefixStr: (prefix)
          - php: ${{ fromJSON(inputs.php_versions)[0] }}
            service: 'mysql:8.0.30'
            db: MySQL 8.0
            prefix: flarum_
            prefixStr: (prefix)
          - php: ${{ fromJSON(inputs.php_versions)[0] }}
            service: mariadb
            db: MariaDB
            prefix: flarum_
            prefixStr: (prefix)

          # @TODO: remove in 2.0
          # Include testing PHP 8.2+ with deprecation warnings disabled.
          - php: 8.2
            php_ini_values: error_reporting=E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
            service: 'mysql:8.0.30'
            db: MySQL 8.0
            iniStr: (no deprecations)
          - php: 8.3
            php_ini_values: error_reporting=E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
            service: 'mysql:8.0.30'
            db: MySQL 8.0
            iniStr: (no deprecations)
          - php: 8.4
            php_ini_values: error_reporting=E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
            service: 'mysql:8.0.30'
            db: MySQL 8.0
            iniStr: (no deprecations)
          - php: 8.5
            php_ini_values: error_reporting=E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
            service: 'mysql:8.0.30'
            db: MySQL 8.0
            iniStr: (no deprecations)

        # To reduce number of actions, we exclude some PHP versions from running with some DB versions.
        exclude:
          - php: ${{ fromJSON(inputs.php_versions)[1] }}
            service: 'mysql:8.0.30'
          - php: ${{ fromJSON(inputs.php_versions)[2] }}
            service: 'mysql:8.0.30'
          - php: ${{ fromJSON(inputs.php_versions)[3] }}
            service: 'mysql:8.0.30'

          # @TODO: remove in 2.0
          # Exclude testing PHP 8.2+ with deprecation warnings enabled.
          - php: 8.2
            php_ini_values: error_reporting=E_ALL
          - php: 8.3
            php_ini_values: error_reporting=E_ALL
          - php: 8.4
            php_ini_values: error_reporting=E_ALL
          - php: 8.5
            php_ini_values: error_reporting=E_ALL

    # Only one of these starts per job: a service with an empty image is skipped.
    services:
      mysql:
        image: ${{ !contains(matrix.service, 'mariadb') && matrix.service || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 13306:3306
        # Over TCP, so the entrypoint's temporary init server (socket only) doesn't count as ready.
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=10
      mariadb:
        image: ${{ contains(matrix.service, 'mariadb') && matrix.service || '' }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 13306:3306
        # `mysqladmin` for tags older than 10.4, which have neither `mariadb-admin` nor `healthcheck.sh`.
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 || mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=10

    name: 'PHP ${{ matrix.php }} / ${{ matrix.db }} ${{ matrix.prefixStr }}${{ matrix.iniStr }}'

    if: >-
      inputs.enable_backend_testing &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name != 'pull_request')

    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: ${{ inputs.php_extensions }}
          tools: phpunit, composer:2.2
          ini-values: ${{ matrix.php_ini_values }}

      - name: Create MySQL Database
        run: |
          mysql -h127.0.0.1 -P13306 -uroot -proot -e 'CREATE DATABASE flarum_test;'

      # Newer mysql versions use the `caching_sha2_password` driver, which isn't supported prior to PHP7.4.
      # When we drop support for PHP7.3, we should remove this from the setup.
      - name: Switch MySQL root to mysql_native_password
        if: matrix.php == '7.3' && !contains(matrix.service, 'mariadb')
        run: mysql -h127.0.0.1 -P13306 -uroot -proot -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';"

      - name: Install Composer dependencies
        run: composer install
        working-directory: ${{ inputs.backend_directory }}

      - name: Setup Composer tests
        run: composer test:setup
        working-directory: ${{ inputs.backend_directory }}
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 13306
          DB_PASSWORD: root
          DB_PREFIX: ${{ matrix.prefix }}

      # Connects the way the tests do (their generated config, pdo_mysql), so a job that
      # reaches a different server than its matrix entry names fails here.
      - name: Check the database server
        run: |
          php -r '
            $db = (require getenv("FLARUM_TEST_TMP_DIR_LOCAL")."/config.php")["database"];
            $pdo = new PDO("mysql:host={$db["host"]};port={$db["port"]}", $db["username"], $db["password"]);
            $version = $pdo->query("SELECT VERSION()")->fetchColumn();
            $service = getenv("SERVICE");
            echo "$service: {$db["host"]}:{$db["port"]} is $version\n";
            $image = explode("@", $service)[0];
            $tag = explode(":", substr(strrchr("/".$image, "/"), 1))[1] ?? "";
            $ok = $db["host"] === "127.0.0.1" && (int) $db["port"] === 13306
              && (stripos($service, "mariadb") !== false) === (stripos($version, "mariadb") !== false)
              && (!preg_match("/^\d+(\.\d+)*/", $tag, $m) || $version === $m[0] || preg_match("/^".preg_quote($m[0])."[.-]/", $version));
            exit($ok ? 0 : 1);
          '
        working-directory: ${{ inputs.backend_directory }}
        env:
          SERVICE: ${{ matrix.service }}

      - name: Run Composer tests
        run: composer test
        working-directory: ${{ inputs.backend_directory }}
        env:
          COMPOSER_PROCESS_TIMEOUT: 600

  phpstan:
    runs-on: ${{ inputs.runner_type }}

    strategy:
      matrix:
        php: ${{ fromJSON(inputs.php_versions) }}
        exclude:
          - php: 8.4
          - php: 8.5

    name: 'PHPStan PHP ${{ matrix.php }}'

    if: >-
      inputs.enable_phpstan &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name != 'pull_request')

    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: ${{ inputs.php_extensions }}
          tools: phpunit, composer:2.2
          ini-values: ${{ matrix.php_ini_values }}

      - name: Install Composer dependencies
        run: composer install
        working-directory: ${{ inputs.backend_directory }}

      - name: Run PHPStan
        run: composer analyse:phpstan
