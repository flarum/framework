name: Backend Tests

on: [workflow_dispatch, push, pull_request]

# Superseded runs keep occupying slots against the account-wide concurrent job limit, so
# cancel them when a branch is pushed again. Runs on the default branch are left alone,
# since each merge commit's result is worth having on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/2.x' }}

jobs:
  run:
    uses: ./.github/workflows/REUSABLE_backend.yml
    with:
      enable_backend_testing: true
      backend_directory: .
      monorepo_tests: "framework/core extensions/akismet extensions/approval extensions/audit extensions/flags extensions/likes extensions/mentions extensions/nicknames extensions/statistics extensions/sticky extensions/subscriptions extensions/suspend extensions/tags extensions/messages extensions/gdpr extensions/realtime extensions/lock php-packages/testing/tests"
